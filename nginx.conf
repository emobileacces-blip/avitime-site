server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /assets/ { expires 7d; add_header Cache-Control "public"; }
    # Espaces testeur / commerçant : la plateforme (version pilote) sur app.avitime.fr. La démo reste sur /demo/.
    location = /espace-commercant { return 302 https://app.avitime.fr/connexion?espace=commercant; }
    location = /espace-testeur    { return 302 https://app.avitime.fr/connexion; }
    location = /devenir-testeur   { return 302 https://app.avitime.fr/inscription; }
    location = /devenir-commercant { return 302 https://app.avitime.fr/inscription?type=commercant; }

    location / { try_files $uri $uri/ $uri.html =404; }
    error_page 404 /index.html;
}
