# Avis sur Avitime : bloc fabriqué par la plateforme (app.avitime.fr), gardé 5 minutes.
proxy_cache_path /var/cache/nginx/avis levels=1 keys_zone=avis:1m max_size=5m inactive=1h use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;  # redirections relatives (le site est derrière Traefik en HTTPS)

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Inclusions côté serveur (SSI) : l'accueil insère le bloc d'avis avec <!--# include virtual="/_avis-avitime" -->.
    # Le texte des avis est donc dans le HTML servi (lisible par Google et les assistants IA). En cas de panne : rien ne s'affiche.
    ssi on;
    ssi_silent_errors on;

    # Statistiques de visite (Matomo hébergé par Avitime sur stats.avitime.fr) : sans cookies, adresses IP masquées,
    # données gardées chez nous — réglage « exemption de consentement » de la CNIL. Ajouté à toutes les pages HTML.
    sub_filter_once on;
    sub_filter '</head>' '<script>var _paq=window._paq=window._paq||[];_paq.push(["disableCookies"]);_paq.push(["trackPageView"]);_paq.push(["enableLinkTracking"]);(function(){var u="https://stats.avitime.fr/";_paq.push(["setTrackerUrl",u+"matomo.php"]);_paq.push(["setSiteId","1"]);var g=document.createElement("script");g.async=true;g.src=u+"matomo.js";document.head.appendChild(g);})();</script></head>';

    location = /_avis-avitime {
        internal;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 3s;
        set $avis_upstream app.avitime.fr;
        proxy_pass https://$avis_upstream/api/public/avis-avitime;
        proxy_ssl_server_name on;
        proxy_ssl_name app.avitime.fr;
        proxy_set_header Host app.avitime.fr;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_cache avis;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie;
        # Plateforme injoignable : bloc vide (jamais la page d'erreur de nginx dans l'accueil)
        proxy_intercept_errors on;
        error_page 400 403 404 500 502 503 504 = @avis_vide;
    }
    location @avis_vide { default_type text/html; return 200 ""; }

    location /assets/ { expires 7d; add_header Cache-Control "public"; }
    # Sous-titres des vidéos (WebVTT) : type MIME explicite, sinon certains navigateurs ignorent la piste
    location ~* \.vtt$ { types { text/vtt vtt; } expires 7d; add_header Cache-Control "public"; }
    # Espaces testeur / commerçant : la plateforme (version pilote) sur app.avitime.fr. La démo reste sur /demo/.
    # 05/11/2026 : guide PME fondu dans le comparatif
    location = /guides/plateformes-avis-clients-pme-comparatif.html { return 301 /guides/comparatif-solutions-avis-clients.html; }
    location = /espace-commercant { return 301 https://app.avitime.fr/connexion?espace=commercant; }
    location = /espace-testeur    { return 301 https://app.avitime.fr/connexion; }
    # /devenir-testeur : page guide (devenir-testeur.html), servie par try_files ci-dessous
    # Anciennes adresses de la plateforme (repérées par les robots via les redirections) : 301 vers app.avitime.fr
    location = /connexion           { return 301 https://app.avitime.fr$request_uri; }
    location = /inscription         { return 301 https://app.avitime.fr$request_uri; }
    location = /mot-de-passe-oublie { return 301 https://app.avitime.fr$request_uri; }
    location ^~ /api/               { return 301 https://app.avitime.fr$request_uri; }
    location = /devenir-commercant { return 301 https://app.avitime.fr/inscription?type=commercant; }
    # Version anglaise : la plateforme passe en anglais (cookie de langue) puis ouvre la page demandée.
    location = /en/merchant      { return 302 https://app.avitime.fr/api/lang?l=en&next=%2Fconnexion%3Fespace%3Dcommercant; }
    location = /en/become-tester { return 302 https://app.avitime.fr/api/lang?l=en&next=%2Finscription; }
    location = /en/become-merchant { return 302 https://app.avitime.fr/api/lang?l=en&next=%2Finscription%3Ftype%3Dcommercant; }
    location = /en { return 301 /en/; }

    # Ancienne page « bientôt disponible » (supprimée le 15/10/2026) : vers l'accueil
    location = /bientot.html { return 301 /; }
    location = /bientot      { return 301 /; }
    location = /guides/arnaques-testeur-produits-apercu.html { return 301 /guides/arnaques-testeur-produits.html; }
    # Barre oblique en trop (/devenir-testeur/) : 301 vers la page quand elle existe (/guides/ et /en/ restent des dossiers)
    location ~ ^(/.+[^/])/$ {
        if (-f $document_root$1.html) { return 301 $1; }
        try_files $uri $uri/ =404;
    }

    location / { try_files $uri $uri/ $uri.html =404; }
    error_page 404 /index.html;
}
